apply plugin: 'com.android.application'

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://repo.dairy.foundation/releases" }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

def robotConfigXmlFiles = ['ivy_config.xml']

interface InjectedExecOps {
    @javax.inject.Inject
    org.gradle.process.ExecOperations getExecOps()
}

tasks.register('pushRobotConfigXml') {
    group = 'install'
    description = 'Push TeamCode robot configuration XML files to /sdcard/FIRST on the connected Control Hub.'
    def execOps = project.objects.newInstance(InjectedExecOps).execOps
    doLast {
        def adbName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'adb.exe' : 'adb'
        def adb = new File(android.sdkDirectory, "platform-tools/${adbName}")
        if (!adb.isFile()) throw new GradleException("Android platform-tools adb not found: ${adb}")
        def xmlDir = project.file('src/main/res/xml')
        robotConfigXmlFiles.each { fileName ->
            def sourceFile = new File(xmlDir, fileName)
            if (!sourceFile.isFile()) throw new GradleException("Robot configuration XML not found: ${sourceFile}")
            execOps.exec { commandLine adb.absolutePath, 'push', sourceFile.absolutePath, '/sdcard/FIRST/' }
        }
    }
}

tasks.named('deploySloth') {
    finalizedBy('pushRobotConfigXml')
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'
    packagingOptions { jniLibs.useLegacyPackaging true }
    testOptions { unitTests { returnDefaultValues = true } }
}

repositories {
    maven { url 'https://repo.dairy.foundation/releases' }
}

dependencies {
    implementation project(':FtcRobotController')

    // Your original Sloth & Panels
    implementation("dev.frozenmilk.sinister:Sloth:0.3.2")
    implementation("com.bylazar.sloth:fullpanels:0.3.2+1.0.13")

    // Your original PsiKit
    implementation 'org.psilynx.psikit:core:0.2.0'
    implementation 'org.psilynx.psikit:ftc:0.2.0'

    testImplementation 'junit:junit:4.13.2'
}